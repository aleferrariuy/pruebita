<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Masters 🏆 Eliminación Directa — Mundial 2026</title>
<style>
  :root{
    --grass-deep:#0b3d24;
    --grass:#054173;
    --grass-light:#165990;
    --chalk:#f5f3ea;
    --gold:#d4a017;
    --gold-bright:#f0c14b;
    --ink:#0b1f14;
    --red-card:#c0392b;
    --line:#2a6b46;
    --card-bg:#ffffff;
    --shadow:0 10px 30px rgba(0,0,0,0.18);
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    font-family:'Georgia', 'Times New Roman', serif;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.04), transparent 40%),
      repeating-linear-gradient(
        90deg,
        var(--grass) 0px,
        var(--grass) 60px,
        var(--grass-light) 60px,
        var(--grass-light) 120px
      );
    color:var(--ink);
    min-height:100vh;
    padding-bottom:80px;
  }

  .field-lines{
    position:relative;
  }

  header{
    text-align:center;
    padding:48px 20px 30px;
    position:relative;
  }

  header::before{
    content:"";
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:900px;
    height:4px;
    background:repeating-linear-gradient(90deg, var(--chalk) 0 18px, transparent 18px 30px);
    opacity:0.55;
  }

  h1{
    font-family:'Trebuchet MS', sans-serif;
    font-size:clamp(2rem, 5vw, 3.2rem);
    color:var(--chalk);
    letter-spacing:2px;
    margin:18px 0 6px;
    text-shadow:0 3px 0 rgba(0,0,0,0.35);
  }

  .subtitle{
    color:var(--gold-bright);
    font-family:'Trebuchet MS', sans-serif;
    font-size:1rem;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:4px;
  }

  .round-tag{
    display:inline-block;
    margin-top:10px;
    padding:6px 18px;
    border:1px solid var(--gold);
    border-radius:30px;
    color:var(--chalk);
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.78rem;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:rgba(0,0,0,0.15);
  }

  .identity-bar{
    max-width:700px;
    margin:30px auto 10px;
    background:rgba(11,31,20,0.55);
    border:1px solid rgba(212,160,23,0.4);
    border-radius:14px;
    padding:18px 22px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    justify-content:center;
    backdrop-filter:blur(2px);
  }

  .identity-field{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1 1 220px;
  }

  .identity-field label{
    color:var(--gold-bright);
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72rem;
    letter-spacing:1.2px;
    text-transform:uppercase;
  }

  .identity-field input{
    padding:10px 12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.92);
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    outline:none;
    transition:box-shadow .15s ease, border-color .15s ease;
  }

  .identity-field input:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,160,23,0.25);
  }

  .identity-field input.invalid{
    border-color:var(--red-card);
  }

  main{
    max-width:1040px;
    margin:34px auto;
    padding:0 18px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(440px, 1fr));
    gap:22px;
  }

  .match-card{
    background:var(--card-bg);
    border-radius:16px;
    box-shadow:var(--shadow);
    overflow:hidden;
    border:1px solid #e2ded0;
    position:relative;
  }

  .match-card.complete{
    box-shadow:0 10px 30px rgba(212,160,23,0.35), 0 0 0 2px var(--gold-bright);
  }

  .match-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 18px;
    background:var(--ink);
    color:var(--chalk);
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.72rem;
    letter-spacing:1px;
    text-transform:uppercase;
  }

  .match-number{
    color:var(--gold-bright);
    font-weight:bold;
  }

  .match-status{
    color:#a8d5b8;
  }

  .match-status.pending{ color:#e2b1a7; }

  .teams-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    padding:18px 14px;
    gap:8px;
  }

  .team{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    padding:10px 8px;
    border-radius:12px;
    transition:background .15s ease;
  }

  .team.winner{
    background:rgba(212,160,23,0.12);
  }

  .flag{
    width:64px;
    height:43px;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.08);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.12));
    flex-shrink:0;
  }

  .flag svg{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
  }

  .team-name{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:0.92rem;
    text-align:center;
    min-height:2.4em;
  }

  .goals-input{
    width:54px;
    height:46px;
    text-align:center;
    font-size:1.3rem;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    border:2px solid #d8d2c0;
    border-radius:8px;
    background:#fbfaf6;
    color:var(--ink);
    outline:none;
  }

  .goals-input:focus{
    border-color:var(--grass);
  }

  .winner-check{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.74rem;
    letter-spacing:0.5px;
    color:#666;
    cursor:default;
    user-select:none;
  }

  .winner-check input[type="radio"]{
    width:18px;
    height:18px;
    accent-color:var(--gold);
    cursor:default;
  }

  .winner-check.active{
    color:var(--ink);
    font-weight:bold;
  }

  .vs-divider{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    color:#b8b2a0;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:0.85rem;
    padding:0 4px;
  }

  .ball{
    font-size:1.4rem;
  }

  .match-date{
    font-size:0.68rem;
    color:#999;
    white-space:nowrap;
  }

  .mode-row{
    border-top:1px dashed #e2ded0;
    padding:14px 18px 18px;
    background:#fbfaf7;
  }

  .mode-label{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.7rem;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:#999;
    margin-bottom:10px;
  }

  .mode-options{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .mode-pill{
    flex:1 1 auto;
    min-width:70px;
    text-align:center;
    position:relative;
  }

  .mode-pill input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    cursor:pointer;
    margin:0;
  }

  .mode-pill input:disabled{
    cursor:not-allowed;
  }

  .mode-pill label{
    display:block;
    padding:8px 6px;
    border:1.5px solid #d8d2c0;
    border-radius:24px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.76rem;
    font-weight:bold;
    color:#888;
    background:#fff;
    transition:all .15s ease;
  }

  .mode-pill input:checked + label{
    background:var(--grass);
    border-color:var(--grass);
    color:#fff;
  }

  .mode-pill input:disabled + label{
    color:#ccc;
    background:#f4f3ef;
    border-color:#ecebe5;
  }

  .mode-pill input:not(:disabled):hover + label{
    border-color:var(--grass);
  }

  footer{
    max-width:1040px;
    margin:30px auto 0;
    padding:0 18px;
    text-align:center;
  }

  .progress-wrap{
    max-width:500px;
    margin:0 auto 18px;
    background:rgba(255,255,255,0.15);
    border-radius:20px;
    height:10px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.2);
  }

  .progress-bar{
    height:100%;
    background:linear-gradient(90deg, var(--gold), var(--gold-bright));
    width:0%;
    transition:width .25s ease;
  }

  .progress-text{
    color:var(--chalk);
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.82rem;
    margin-bottom:18px;
    opacity:0.85;
  }

  .download-btn{
    font-family:'Trebuchet MS', sans-serif;
    font-size:1.05rem;
    font-weight:bold;
    letter-spacing:1px;
    padding:16px 46px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold));
    color:var(--ink);
    box-shadow:0 8px 22px rgba(212,160,23,0.45);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .download-btn:disabled{
    background:#555;
    color:#999;
    cursor:not-allowed;
    box-shadow:none;
    opacity:0.6;
  }

  .download-btn:not(:disabled):hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px rgba(212,160,23,0.55);
  }

  .download-note{
    color:#cfead9;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.75rem;
    margin-top:14px;
    opacity:0.8;
  }

  @media (max-width:520px){
    .flag{ width:48px; height:32px; }
    .team-name{ font-size:0.8rem; }
    .goals-input{ width:44px; height:40px; font-size:1.1rem; }
    main{ grid-template-columns:1fr; }
  }
</style>
</head>

  "Uzbekistán": "<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" viewBox=\"0 0 900 450\"><path fill=\"#fff\" d=\"M0 0h900v450H0z\"/><path fill=\"#1eb53a\" d=\"M0 0h900v45H0z\"/><path fill=\"#1eb53a\" d=\"M0 405h900v45H0z\"/><path fill=\"#0099b5\" d=\"M0 0h900v195H0z\"/><path fill=\"#ce1126\" d=\"M0 187h900v8H0zM0 255h900v8H0z\"/><circle cx=\"170\" cy=\"100\" r=\"65\" fill=\"#fff\"/><circle cx=\"195\" cy=\"100\" r=\"55\" fill=\"#0099b5\"/><g fill=\"#fff\"><g id=\"uz-star1\" transform=\"translate(330,40)\"><path d=\"m0-15 4 11h12l-10 7 4 11-10-7-10 7 4-11-10-7h12z\"/></g><use xlink:href=\"#uz-star1\" x=\"60\"/><use xlink:href=\"#uz-star1\" x=\"120\"/><use xlink:href=\"#uz-star1\" y=\"40\" x=\"30\"/><use xlink:href=\"#uz-star1\" y=\"40\" x=\"90\"/><use xlink:href=\"#uz-star1\" y=\"80\"/><use xlink:href=\"#uz-star1\" y=\"80\" x=\"60\"/><use xlink:href=\"#uz-star1\" y=\"80\" x=\"120\"/><use xlink:href=\"#uz-star1\" y=\"120\" x=\"30\"/><use xlink:href=\"#uz-star1\" y=\"120\" x=\"90\"/><use xlink:href=\"#uz-star1\" y=\"160\"/><use xlink:href=\"#uz-star1\" y=\"160\" x=\"60\"/><use xlink:href=\"#uz-star1\" y=\"160\" x=\"120\"/></g></svg>"
};
// AQUI SE CARGAN LOS PARTIDOS A SER JUGADOS - ES LO UNICO A SER EDITADO
const MATCHES = [
  { team1:"PaísA", team2:"PaísB", date:"28/6/2026" },
  { team1:"PaísA", team2:"PaísB", date:"29/6/2026" },
  { team1:"Alemania", team2:"PaísB", date:"29/6/2026" },
  { team1:"PaísA", team2:"PaísB", date:"29/6/2026" },
  { team1:"PaísA", team2:"PaísB", date:"30/6/2026" },
  { team1:"PaísA", team2:"PaísB", date:"30/6/2026" },
  { team1:"México", team2:"PaísB", date:"30/6/2026" },
  { team1:"PaísA", team2:"PaísB", date:"1/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"1/7/2026" },
  { team1:"EE.UU.", team2:"PaísB", date:"1/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"2/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"2/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"3/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"3/7/2026" },
  { team1:"Argentina", team2:"PaísB", date:"3/7/2026" },
  { team1:"PaísA", team2:"PaísB", date:"3/7/2026" }
];
// ------------------------------------------------------------------------
const MODES = [
  { code:"ED", label:"ED" },
  { code:"TS", label:"TS" },
  { code:"TP", label:"TP" },
  { code:"MS", label:"MS" }
];

// Estado en memoria de cada partido
const state = MATCHES.map(() => ({
  goals1: "",
  goals2: "",
  winner: null,   // 1 o 2
  mode: null      // "ED" | "TS" | "TP" | "MS"
}));

const container = document.getElementById("matchesContainer");

function buildCard(match, idx){
  const card = document.createElement("div");
  card.className = "match-card";
  card.id = `card-${idx}`;

  card.innerHTML = `
    <div class="match-meta">
      <span class="match-number">Partido ${idx+1} / 16</span>
      <span class="match-status pending" id="status-${idx}">Pendiente</span>
    </div>
    <div class="teams-row">
      <div class="team" id="team1-${idx}">
        <div class="flag">${FLAGS[match.team1] || "🏳️"}</div>
        <div class="team-name">${match.team1}</div>
        <input type="number" min="0" class="goals-input" id="goals1-${idx}" placeholder="0" inputmode="numeric">
        <label class="winner-check" id="wlabel1-${idx}">
          <input type="radio" name="winner-${idx}" id="winner1-${idx}" value="1" disabled>
          Ganador
        </label>
      </div>

      <div class="vs-divider">
        <span class="ball">⚽</span>
        <span>VS</span>
        <span class="match-date">${match.date}</span>
      </div>

      <div class="team" id="team2-${idx}">
        <div class="flag">${FLAGS[match.team2] || "🏳️"}</div>
        <div class="team-name">${match.team2}</div>
        <input type="number" min="0" class="goals-input" id="goals2-${idx}" placeholder="0" inputmode="numeric">
        <label class="winner-check" id="wlabel2-${idx}">
          <input type="radio" name="winner-${idx}" id="winner2-${idx}" value="2" disabled>
          Ganador
        </label>
      </div>
    </div>

    <div class="mode-row">
      <div class="mode-label">Modalidad de resolución</div>
      <div class="mode-options" id="modes-${idx}">
        ${MODES.map(m => `
          <div class="mode-pill">
            <input type="radio" name="mode-${idx}" id="mode-${m.code}-${idx}" value="${m.code}">
            <label for="mode-${m.code}-${idx}">${m.label}</label>
          </div>
        `).join("")}
      </div>
    </div>
  `;

  container.appendChild(card);

  // Listeners
  const goals1El = document.getElementById(`goals1-${idx}`);
  const goals2El = document.getElementById(`goals2-${idx}`);

  goals1El.addEventListener("input", () => onGoalsChange(idx));
  goals2El.addEventListener("input", () => onGoalsChange(idx));

  MODES.forEach(m => {
    document.getElementById(`mode-${m.code}-${idx}`).addEventListener("click", (e) => onModeClick(idx, m.code, e.target));
  });
}

function onGoalsChange(idx){
  const g1raw = document.getElementById(`goals1-${idx}`).value;
  const g2raw = document.getElementById(`goals2-${idx}`).value;

  state[idx].goals1 = g1raw;
  state[idx].goals2 = g2raw;

  const g1 = g1raw === "" ? null : parseInt(g1raw, 10);
  const g2 = g2raw === "" ? null : parseInt(g2raw, 10);

  let winner = null;
  if (g1 !== null && g2 !== null && !isNaN(g1) && !isNaN(g2) && g1 !== g2){
    // Hay un ganador claro solo si ambos goles están cargados y son distintos.
    // Si son iguales (empate) el partido queda sin ganador, es decir, pendiente.
    winner = g1 > g2 ? 1 : 2;
  }

  applyWinnerState(idx, winner);

  updateCardStatus(idx);
  refreshGlobalState();
}

function applyWinnerState(idx, who){
  state[idx].winner = who;

  const t1 = document.getElementById(`team1-${idx}`);
  const t2 = document.getElementById(`team2-${idx}`);
  const wl1 = document.getElementById(`wlabel1-${idx}`);
  const wl2 = document.getElementById(`wlabel2-${idx}`);
  const winner1El = document.getElementById(`winner1-${idx}`);
  const winner2El = document.getElementById(`winner2-${idx}`);

  // Los radios son de solo lectura (disabled): el navegador no permite
  // tocarlos manualmente, solo reflejan el resultado calculado a partir de los goles.
  winner1El.checked = (who === 1);
  winner2El.checked = (who === 2);

  t1.classList.toggle("winner", who === 1);
  t2.classList.toggle("winner", who === 2);
  wl1.classList.toggle("active", who === 1);
  wl2.classList.toggle("active", who === 2);
}


function onModeClick(idx, code, inputEl){
  const wasSelected = state[idx].mode === code;

  if (wasSelected){
    // Toggle off: deseleccionar y rehabilitar las 4 opciones
    inputEl.checked = false;
    state[idx].mode = null;
    MODES.forEach(m => {
      document.getElementById(`mode-${m.code}-${idx}`).disabled = false;
    });
  } else {
    // Seleccionar esta modalidad y deshabilitar las otras 3
    state[idx].mode = code;
    MODES.forEach(m => {
      const otherInput = document.getElementById(`mode-${m.code}-${idx}`);
      otherInput.disabled = (m.code !== code);
    });
  }

  updateCardStatus(idx);
  refreshGlobalState();
}

function updateCardStatus(idx){
  const s = state[idx];
  const card = document.getElementById(`card-${idx}`);
  const statusEl = document.getElementById(`status-${idx}`);

  const hasGoals = s.goals1 !== "" && s.goals2 !== "";
  const g1 = hasGoals ? parseInt(s.goals1, 10) : null;
  const g2 = hasGoals ? parseInt(s.goals2, 10) : null;
  const isTied = hasGoals && !isNaN(g1) && !isNaN(g2) && g1 === g2;

  const complete = hasGoals && s.winner !== null && s.mode !== null;

  card.classList.toggle("complete", complete);
  if (complete){
    statusEl.textContent = "✓ Completo";
    statusEl.classList.remove("pending");
  } else if (isTied){
    statusEl.textContent = "⚠ Empate no permitido";
    statusEl.classList.add("pending");
  } else {
    statusEl.textContent = "Pendiente";
    statusEl.classList.add("pending");
  }
}

function isMatchComplete(idx){
  const s = state[idx];
  return s.goals1 !== "" && s.goals2 !== "" && s.winner !== null && s.mode !== null;
}

function refreshGlobalState(){
  const completedCount = state.filter((_, idx) => isMatchComplete(idx)).length;
  const total = MATCHES.length;

  document.getElementById("progressText").textContent = `${completedCount} de ${total} partidos completos`;
  document.getElementById("progressBar").style.width = `${(completedCount/total)*100}%`;

  const nameOk = document.getElementById("fullname").value.trim().length > 0;
  const emailOk = isValidEmail(document.getElementById("email").value.trim());

  const allMatchesOk = completedCount === total;
  const downloadBtn = document.getElementById("downloadBtn");
  downloadBtn.disabled = !(allMatchesOk && nameOk && emailOk);
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// ---------- Inicialización ----------
MATCHES.forEach((m, idx) => buildCard(m, idx));

document.getElementById("fullname").addEventListener("input", (e) => {
  e.target.classList.remove("invalid");
  refreshGlobalState();
});
document.getElementById("email").addEventListener("input", (e) => {
  e.target.classList.remove("invalid");
  refreshGlobalState();
});

refreshGlobalState();

// ---------- Descarga CSV ----------
function csvEscape(value){
  const str = String(value ?? "");
  if (/[",\n;]/.test(str)){
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

document.getElementById("downloadBtn").addEventListener("click", () => {
  const fullname = document.getElementById("fullname").value.trim();
  const email = document.getElementById("email").value.trim();

  const nameOk = fullname.length > 0;
  const emailOk = isValidEmail(email);

  if (!nameOk){ document.getElementById("fullname").classList.add("invalid"); }
  if (!emailOk){ document.getElementById("email").classList.add("invalid"); }
  if (!nameOk || !emailOk) return;

  const allComplete = state.every((_, idx) => isMatchComplete(idx));
  if (!allComplete) return;

  const headers = [
    "Nombre completo",
    "Email",
    "Partido N°",
    "Fecha",
    "Pais 1",
    "Goles Pais 1",
    "Ganador Pais 1",
    "Pais 2",
    "Goles Pais 2",
    "Ganador Pais 2",
    "Modalidad"
  ];

  const rows = MATCHES.map((m, idx) => {
    const s = state[idx];
    return [
      fullname,
      email,
      idx + 1,
      m.date,
      m.team1,
      s.goals1,
      s.winner === 1 ? "SI" : "NO",
      m.team2,
      s.goals2,
      s.winner === 2 ? "SI" : "NO",
      s.mode
    ];
  });

  const csvLines = [headers, ...rows].map(row => row.map(csvEscape).join(";"));
  const csvContent = "\uFEFF" + csvLines.join("\r\n");

  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = fullname.replace(/[^a-zA-Z0-9]+/g, "_");
  a.href = url;
  a.download = `eliminacion_directa_mundial2026_${safeName}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
